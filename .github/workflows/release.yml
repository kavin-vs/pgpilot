name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  BIN_NAME: pgpilot

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG does not match Cargo.toml version $PKG_VERSION"
            exit 1
          fi

  build:
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build + package (unix)
        if: matrix.archive == 'tar.gz'
        run: scripts/build-target.sh ${{ matrix.target }} ${{ github.ref_name }}
      - name: Build (windows)
        if: matrix.archive == 'zip'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe -DestinationPath dist/${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: (cd dist && sha256sum -- * > checksums.txt)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --title "${{ github.ref_name }}"

  choco-pack:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: choco pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          choco pack choco/pgpilot.nuspec --version $version --outputdirectory dist-choco
      - name: Attach .nupkg to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist-choco/*.nupkg --clobber
      # Publishing to chocolatey.org needs a CHOCO_API_KEY repo secret (from
      # a chocolatey.org account) -- until that secret is set, the .nupkg
      # above (installable via `choco install pgpilot -s <folder>`) is all
      # that ships. First-time submission also goes through Chocolatey's
      # manual moderation review before `choco install pgpilot` works
      # straight from the community repo.
      #
      # The `secrets` context can't be referenced directly in a step/job
      # `if:` (GitHub Actions rejects it at schema-validation time, which
      # silently breaks dispatch for the *whole* workflow file, not just
      # this job -- hit this for real: it took down tag-triggered releases
      # entirely from the commit that added this job onward). Pull the
      # secret into `env:` unconditionally instead and branch on that env
      # var inside the script.
      - name: Push to Chocolatey community repo
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:CHOCO_API_KEY)) {
            Write-Host "CHOCO_API_KEY not set, skipping chocolatey.org push"
            exit 0
          }
          $version = "${{ github.ref_name }}".TrimStart('v')
          choco push "dist-choco/pgpilot.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
