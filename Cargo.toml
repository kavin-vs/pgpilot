[package]
name = "pgpilot"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.31"
ratatui = "0.30.2"
rpassword = "7.5.4"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
self_update = { version = "1.3.0", default-features = false, features = [
    "ureq", "rustls", "github", "checksums",
    "archive-tar", "compression-tar-gz",
    "archive-zip", "compression-zip-deflate",
] }
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
toml = "1.1.3"
